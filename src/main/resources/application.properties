spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}
spring.jackson.serialization.write-dates-as-timestamps=false

# HEALTH ENDPOINT
management.endpoint.health.show-details=always

access.control.allow.origin=${CORS_ORIGIN:*}
access.control.allow.methods=POST, PUT, GET, OPTIONS, DELETE
access.control.allow.headers=Authorization, Content-Type
access.control.max.age=3600

app.upload.root=${APP_UPLOAD_ROOT:D:/DATN/eo-be/data}
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Gmail SMTP — bat 2FA, tao App Password tai https://myaccount.google.com/apppasswords
# Dien username/password ben duoi (password la App Password 16 ky tu, khong phai mat khau Gmail)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${MAIL_FROM:}
