services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  be:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - mongo
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      MONGO_DATABASE: exam_online
      JWT_SECRET: change-me-in-production
      APP_UPLOAD_ROOT: /data
      CORS_ORIGIN: "*"
      PORT: 8080
    volumes:
      - ./data:/data

volumes:
  mongo_data:
